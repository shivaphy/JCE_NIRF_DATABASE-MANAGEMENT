    // --- 4. SCORE CALCULATION & KPI ANALYTICS ---
    function calculatePillarScores(data) {
      if (!data) return { tlr: 0, rpc: 0, go: 0, oi: 0, pr: 0, total: 0 };

      const ssScore = Math.min(25, (Number(data.tlr_ss || 0) / 750) * 25);
      const fsrVal = Number(data.tlr_fsr || 20);
      const fsrScore = Math.min(30, Math.max(0, (20 - (fsrVal - 15) * 2) * (30 / 20)));
      const fqeScore = (Number(data.tlr_fqe || 0) / 100) * 25;
      const fruScore = (Number(data.tlr_fru || 0) / 100) * 20;
      const tlr = Number(Math.min(100, ssScore + fsrScore + fqeScore + fruScore).toFixed(2));

      const puScore = Math.min(35, (Number(data.rpc_pu || 0) / 70) * 35);
      const qpScore = Math.min(40, (Number(data.rpc_qp || 0) / 450) * 40);
      const iprScore = Math.min(15, (Number(data.rpc_ipr || 0) / 15) * 15);
      const fpppScore = Math.min(10, (Number(data.rpc_fppp || 0) / 30) * 10);
      const rpc = Number(Math.min(100, puScore + qpScore + iprScore + fpppScore).toFixed(2));

      const gueScore = (Number(data.go_gue || 0) / 100) * 40;
      const salaryVal = Number(data.go_gph_salary || 0);
      const gphScore = Math.min(40, (salaryVal / 7.5) * 20 + (Number(data.go_gph_placed || 0) / 150) * 20);
      const gphdScore = Math.min(20, (Number(data.go_gphd || 0) / 5) * 20);
      const go = Number(Math.min(100, gueScore + gphScore + gphdScore).toFixed(2));

      const rdScore = Math.min(30, (Number(data.oi_rd || 0) / 30) * 30);
      const wdScore = Math.min(30, (Number(data.oi_wd || 0) / 50) * 30);
      const escsScore = Math.min(20, (Number(data.oi_escs || 0) / 50) * 20);
      const pcsScore = (Number(data.oi_pcs || 0) / 100) * 20;
      const oi = Number(Math.min(100, rdScore + wdScore + escsScore + pcsScore).toFixed(2));

      const peer = Number(data.pr_peer || 0);
      const employer = Number(data.pr_employer || 0);
      const pr = Number(Math.min(100, (peer * 0.5) + (employer * 0.5)).toFixed(2));

      const total = Number((
        (tlr * NIRF_WEIGHTS.TLR) +
        (rpc * NIRF_WEIGHTS.RPC) +
        (go  * NIRF_WEIGHTS.GO)  +
        (oi  * NIRF_WEIGHTS.OI)  +
        (pr  * NIRF_WEIGHTS.PR)
      ).toFixed(2));

      return { tlr, rpc, go, oi, pr, total };
    }

    function getAggregatedAnalytics() {
      const yearData = state.dataRecords[state.selectedYear] || {};
      const deptKeys = Object.keys(yearData);
      if (deptKeys.length === 0) return null;

      let totalTLR = 0, totalRPC = 0, totalGO = 0, totalOI = 0, totalPR = 0;
      let totalEnrolled = 0, totalPubs = 0, totalCitations = 0, totalPatents = 0, totalGrantLakhs = 0, totalPlaced = 0;
      let highestSalary = 0, highestSalaryDept = '';
      let highestPubs = 0, highestPubsDept = '';

      const departmentScores = [];

      deptKeys.forEach(deptId => {
        const dData = yearData[deptId] || {};
        const pillar = calculatePillarScores(dData);
        totalTLR += pillar.tlr;
        totalRPC += pillar.rpc;
        totalGO  += pillar.go;
        totalOI  += pillar.oi;
        totalPR  += pillar.pr;

        const ss = Number(dData.tlr_ss || 0);
        const pu = Number(dData.rpc_pu || 0);
        const qp = Number(dData.rpc_qp || 0);
        const ipr = Number(dData.rpc_ipr || 0);
        const fppp = Number(dData.rpc_fppp || 0);
        const placed = Number(dData.go_gph_placed || 0);
        const salary = Number(dData.go_gph_salary || 0);

        totalEnrolled += ss;
        totalPubs += pu;
        totalCitations += qp;
        totalPatents += ipr;
        totalGrantLakhs += fppp;
        totalPlaced += placed;

        if (salary > highestSalary) { highestSalary = salary; highestSalaryDept = deptId; }
        if (pu > highestPubs) { highestPubs = pu; highestPubsDept = deptId; }

        const rawDept = state.departments.find(d => d.id === deptId);
        departmentScores.push({
          deptId,
          deptName: rawDept ? rawDept.name : deptId,
          intake: rawDept ? rawDept.intake : 60,
          raw: dData,
          ...pillar
        });
      });

      const count = deptKeys.length;
      const avgTLR = Number((totalTLR / count).toFixed(2));
      const avgRPC = Number((totalRPC / count).toFixed(2));
      const avgGO  = Number((totalGO / count).toFixed(2));
      const avgOI  = Number((totalOI / count).toFixed(2));
      const avgPR  = Number((totalPR / count).toFixed(2));

      const compositeScore = Number((
        (avgTLR * NIRF_WEIGHTS.TLR) +
        (avgRPC * NIRF_WEIGHTS.RPC) +
        (avgGO  * NIRF_WEIGHTS.GO)  +
        (avgOI  * NIRF_WEIGHTS.OI)  +
        (avgPR  * NIRF_WEIGHTS.PR)
      ).toFixed(2));

      let predictedBand = "Rank 151 - 200 Band";
      let badgeColor = "bg-amber-50 text-amber-800 border-amber-200";
      if (compositeScore >= 62.0) {
        predictedBand = "Top 100 All-India Rank (Target Range 65 - 90)";
        badgeColor = "bg-emerald-50 text-emerald-800 border-emerald-200";
      } else if (compositeScore >= 54.0) {
        predictedBand = "Rank 101 - 150 Band";
        badgeColor = "bg-blue-50 text-blue-800 border-blue-200";
      } else if (compositeScore < 45.0) {
        predictedBand = "Rank 201 - 300 / Emerging Contender";
        badgeColor = "bg-rose-50 text-rose-800 border-rose-200";
      }

      const historyTrend = state.academicYears.map(yr => {
        const yRec = state.dataRecords[yr] || {};
        const yDepts = Object.keys(yRec);
        if (yDepts.length === 0) return { year: yr, score: 0 };
        let sum = 0;
        yDepts.forEach(d => { sum += calculatePillarScores(yRec[d]).total; });
        return { year: yr, score: Number((sum / yDepts.length).toFixed(2)) };
      }).reverse();

      return {
        avgTLR, avgRPC, avgGO, avgOI, avgPR,
        compositeScore,
        predictedBand,
        badgeColor,
        departmentScores,
        historyTrend,
        kpis: {
          totalEnrolled, totalPubs, totalCitations, totalPatents,
          totalGrantLakhs: totalGrantLakhs.toFixed(1), totalPlaced,
          highestSalary, highestSalaryDept, highestPubs, highestPubsDept
        }
      };
    }

      const oiR  = analytics.avgOI / 100;
      const prR  = analytics.avgPR / 100;

      const realPoints = [
        `${150},${150 - 110 * tlrR}`,
        `${150 + 104 * rpcR},${150 - 34 * rpcR}`,
        `${150 + 64 * goR},${150 + 88 * goR}`,

    // --- 6. EVENT DISPATCH & LISTENERS ---
    function bindLoginEvents() {
      const form = document.getElementById('loginForm');
      if (!form) return;

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('loginInput').value.trim();

        if (isFirebaseReady && auth) {
          auth.signInWithEmailAndPassword(input, 'password123')
            .then(userCred => {
              state.currentUser = { email: userCred.user.email, role: 'admin', departmentId: null };
              showToast('Authenticated via Firebase.');
            })
            .catch(() => authenticateLocally(input));
        } else {
          authenticateLocally(input);
        }
      });
    }

    function authenticateLocally(input) {
      if (input === 'shiva@1' || input.toLowerCase() === 'admin' || input.toLowerCase().includes('admin@jce.ac.in')) {
        state.currentUser = { email: 'admin@jce.ac.in', role: 'admin', departmentId: null };
        state.activeTab = 'dashboard';
        logAudit('Admin Sign In', 'Superadmin session authorized for JCE Central Cell.');
        showToast('Welcome, Administrator.');
      } else {
        const matchedDept = state.departments.find(d => d.accessKey === input || d.id.toLowerCase() === input.toLowerCase() || input.toLowerCase().includes(d.id.toLowerCase()));
        if (matchedDept) {
          state.currentUser = { email: `${matchedDept.id.toLowerCase()}@jce.ac.in`, role: 'dept_user', departmentId: matchedDept.id };
          state.selectedEntryDept = matchedDept.id;
          state.activeTab = 'data-entry';
          logAudit('Dept Sign In', `Authorized login for ${matchedDept.name}`);
          showToast(`Welcome, ${matchedDept.id} Department Coordinator.`);
        } else {
          state.authError = 'Invalid Key. Use "shiva@1" for Admin or valid Department Passkey.';
          render();
        }
      }
    }

    function bindAppEvents() {
      // Sign Out
      const handleSignOut = () => {
        if (isFirebaseReady && auth) auth.signOut();
        state.currentUser = null;
        state.activeTab = 'dashboard';
        render();
      };
      const sm = document.getElementById('btnSignOutMobile');
      const sd = document.getElementById('btnSignOutDesktop');
      if (sm) sm.addEventListener('click', handleSignOut);
      if (sd) sd.addEventListener('click', handleSignOut);

      // Cycle Select
      const selectCycle = document.getElementById('selectCycle');
      if (selectCycle) {
        selectCycle.addEventListener('change', (e) => {
          state.selectedYear = e.target.value;
          render();
        });
      }

      // Dept Filter
      const selectDeptFilter = document.getElementById('selectDeptFilter');
      if (selectDeptFilter) {
        selectDeptFilter.addEventListener('change', (e) => {
          state.selectedDeptFilter = e.target.value;
          render();
        });
      }

      // Graph View
      document.querySelectorAll('.btn-graph-view').forEach(btn => {
        btn.addEventListener('click', () => {
          state.graphMetricView = btn.getAttribute('data-view');
          render();
        });
      });

      // Tabs
      document.querySelectorAll('.nav-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeTab = btn.getAttribute('data-tab');
          render();
        });
      });

      // Entry Dept Switch
      document.querySelectorAll('.btn-switch-entry-dept').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedEntryDept = btn.getAttribute('data-dept');
          render();
        });
      });

      // Category Switch
      document.querySelectorAll('.btn-category-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedCategory = btn.getAttribute('data-cat');
          render();
        });
      });

      // Save Metrics
      const btnSaveMetrics = document.getElementById('btnSaveMetrics');
      if (btnSaveMetrics) {
        btnSaveMetrics.addEventListener('click', () => {
          const form = document.getElementById('metricsForm');
          if (!form) return;

          const formData = new FormData(form);
          const targetDeptId = state.currentUser.role === 'admin' ? state.selectedEntryDept : state.currentUser.departmentId;

          if (!state.dataRecords[state.selectedYear]) state.dataRecords[state.selectedYear] = {};
          if (!state.dataRecords[state.selectedYear][targetDeptId]) state.dataRecords[state.selectedYear][targetDeptId] = {};

          formData.forEach((val, key) => {
            state.dataRecords[state.selectedYear][targetDeptId][key] = val === '' ? '' : Number(val);
          });

          if (isFirebaseReady && db) {
            db.collection('cycles').doc(state.selectedYear).collection('records').doc(targetDeptId)
              .set(state.dataRecords[state.selectedYear][targetDeptId], { merge: true })
              .catch(e => console.warn(e));
          }

          logAudit('Updated Records', `Updated metrics for ${targetDeptId} in cycle ${state.selectedYear}`);
          showToast(`Saved metrics for ${targetDeptId} successfully.`);
        });
      }

      // Credentials Vault Actions
      const btnToggleAllKeys = document.getElementById('btnToggleAllKeys');
      if (btnToggleAllKeys) {
        btnToggleAllKeys.addEventListener('click', () => {
          state.allKeysRevealed = !state.allKeysRevealed;
          render();
        });
      }

      document.querySelectorAll('.btn-toggle-key').forEach(btn => {
        btn.addEventListener('click', () => {
          const deptId = btn.getAttribute('data-dept');
          state.revealedKeys[deptId] = !state.revealedKeys[deptId];
          render();
        });
      });

      document.querySelectorAll('.btn-rotate-key').forEach(btn => {
        btn.addEventListener('click', () => {
          const deptId = btn.getAttribute('data-dept');
          const newKey = `JCE-${deptId}-${Math.floor(1000 + Math.random() * 9000)}`;
          const d = state.departments.find(item => item.id === deptId);
          if (d) {
            d.accessKey = newKey;
            d.lastActive = 'Rotated Now';
          }
          logAudit('Key Rotated', `Generated new passkey for ${deptId}`);
          showToast(`Passkey rotated for ${deptId}`);
        });
      });

      // Export Actions
      const btnCSV = document.getElementById('btnExportCSV');
      if (btnCSV) {
        btnCSV.addEventListener('click', () => {
          const yearData = state.dataRecords[state.selectedYear] || {};
          let csv = "Department,TLR,RPC,GO,OI,PR,Total\n";
          Object.keys(yearData).forEach(dId => {
            const p = calculatePillarScores(yearData[dId]);
            csv += `"${dId}",${p.tlr},${p.rpc},${p.go},${p.oi},${p.pr},${p.total}\n`;
          });
          const link = document.createElement("a");
          link.href = "data:text/csv;charset=utf-8," + encodeURI(csv);
          link.download = `JCE_NIRF_${state.selectedYear}.csv`;
          link.click();
          showToast(`Exported CSV for ${state.selectedYear}`);
        });
      }

      const btnJSON = document.getElementById('btnExportJSON');
      if (btnJSON) {
        btnJSON.addEventListener('click', () => {
          const payload = { institution: COLLEGE_NAME, year: state.selectedYear, records: state.dataRecords[state.selectedYear] };
          const link = document.createElement("a");
          link.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payload, null, 2));
          link.download = `JCE_NIRF_Snapshot_${state.selectedYear}.json`;
          link.click();
          showToast('Master JSON snapshot downloaded.');
        });
      }

      const btnPDF = document.getElementById('btnPrintPDF');
      if (btnPDF) {
        btnPDF.addEventListener('click', () => window.print());
      }

      // Modals
      document.querySelectorAll('.btn-edit-dept').forEach(btn => {
        btn.addEventListener('click', () => {
          const dId = btn.getAttribute('data-dept');
          const d = state.departments.find(item => item.id === dId);

            state.editingDeptModal = { ...d };

      const closeEdit = () => { state.editingDeptModal = null; render(); };
      const ce1 = document.getElementById('btnCloseEditModal');
      const ce2 = document.getElementById('btnCancelEdit');
      if (ce1) ce1.addEventListener('click', closeEdit);
      if (ce2) ce2.addEventListener('click', closeEdit);

      const formEdit = document.getElementById('formEditDept');
      if (formEdit) {
        formEdit.addEventListener('submit', (e) => {
          e.preventDefault();
          const targetId = state.editingDeptModal.id;
          const name = document.getElementById('editDeptName').value.trim();
          const hod = document.getElementById('editDeptHod').value.trim();
          const intake = Number(document.getElementById('editDeptIntake').value) || 60;

          const idx = state.departments.findIndex(d => d.id === targetId);
          if (idx !== -1) {
            state.departments[idx] = { ...state.departments[idx], name, hod, intake };
          }
          if (isFirebaseReady && db) {
            db.collection('departments').doc(targetId).set({ name, hod, intake }, { merge: true }).catch(err => console.warn(err));
          }
          logAudit('Profile Configured', `Updated ${targetId}: HOD -> ${hod}, Intake -> ${intake}`);
          state.editingDeptModal = null;
          showToast(`Saved configuration for ${targetId}`);
        });
      }

      // Add Dept
      const btnOpenAddDept = document.getElementById('btnOpenAddDept');
      if (btnOpenAddDept) {
        btnOpenAddDept.addEventListener('click', () => { state.showAddDeptModal = true; render(); });
      }
      const closeAdd = () => { state.showAddDeptModal = false; render(); };
      const ca1 = document.getElementById('btnCloseAddModal');
      const ca2 = document.getElementById('btnCancelAdd');
      if (ca1) ca1.addEventListener('click', closeAdd);
      if (ca2) ca2.addEventListener('click', closeAdd);

      const formAdd = document.getElementById('formAddDept');
      if (formAdd) {
        formAdd.addEventListener('submit', (e) => {
          e.preventDefault();
          const id = document.getElementById('addDeptId').value.trim().toUpperCase();
          const name = document.getElementById('addDeptName').value.trim();
          const hod = document.getElementById('addDeptHod').value.trim() || 'Coordinator';
          const intake = Number(document.getElementById('addDeptIntake').value) || 60;

          if (!state.departments.some(d => d.id === id)) {
            const newDept = { id, name, code: String(state.departments.length + 1).padStart(2, '0'), hod, intake, accessKey: `JCE-${id}-${Math.floor(1000 + Math.random() * 9000)}`, status: 'Active' };
            state.departments.push(newDept);
            logAudit('Department Registered', `Created ${name} (${id})`);
            showToast(`Department ${name} added.`);
          }
          state.showAddDeptModal = false;
          render();
        });
      }

      // Add Year
      const btnOpenAddYear = document.getElementById('btnOpenAddYear');
      if (btnOpenAddYear) {
        btnOpenAddYear.addEventListener('click', () => { state.showAddYearModal = true; render(); });
      }
      const closeYear = () => { state.showAddYearModal = false; render(); };
      const cy1 = document.getElementById('btnCloseYearModal');
      const cy2 = document.getElementById('btnCancelYear');
      if (cy1) cy1.addEventListener('click', closeYear);
      if (cy2) cy2.addEventListener('click', closeYear);

      const formYear = document.getElementById('formAddYear');
      if (formYear) {
        formYear.addEventListener('submit', (e) => {
          e.preventDefault();
          const y = document.getElementById('addYearInput').value.trim();
          if (y && !state.academicYears.includes(y)) {
            state.academicYears.unshift(y);
            state.dataRecords[y] = JSON.parse(JSON.stringify(state.dataRecords[state.selectedYear] || {}));
            state.selectedYear = y;
            logAudit('Cycle Added', `Initialized ${y}`);
            showToast(`Assessment cycle ${y} created.`);
          }
          state.showAddYearModal = false;
          render();
        });
      }

      // Add Tab
      const btnOpenAddTab = document.getElementById('btnOpenAddTab');
      if (btnOpenAddTab) {
        btnOpenAddTab.addEventListener('click', () => { state.showAddTabModal = true; render(); });
      }
      const closeTab = () => { state.showAddTabModal = false; render(); };
      const ct1 = document.getElementById('btnCloseTabModal');
      const ct2 = document.getElementById('btnCancelTab');
      if (ct1) ct1.addEventListener('click', closeTab);
      if (ct2) ct2.addEventListener('click', closeTab);

      const formTab = document.getElementById('formAddTab');
      if (formTab) {
        formTab.addEventListener('submit', (e) => {
          e.preventDefault();
          const tabName = document.getElementById('addTabInput').value.trim();
          const tabId = tabName.toUpperCase().replace(/\s+/g, '_');
          if (!state.customTabs.some(t => t.id === tabId)) {
            state.customTabs.push({ id: tabId, name: tabName });
            showToast(`Custom dimension "${tabName}" appended.`);
          }
          state.showAddTabModal = false;
          render();
        });
      }

      // AI Simulator Sliders
      const rPhd = document.getElementById('rngPhd');
      if (rPhd) rPhd.addEventListener('input', (e) => { state.simulatedBoosts.facultyPhdBoost = Number(e.target.value); render(); });
      const rPubs = document.getElementById('rngPubs');
      if (rPubs) rPubs.addEventListener('input', (e) => { state.simulatedBoosts.publicationsBoost = Number(e.target.value); render(); });
      const rSal = document.getElementById('rngSalary');
      if (rSal) rSal.addEventListener('input', (e) => { state.simulatedBoosts.salaryLakhsBoost = Number(e.target.value); render(); });
      const rPerc = document.getElementById('rngPerception');
      if (rPerc) rPerc.addEventListener('input', (e) => { state.simulatedBoosts.perceptionBoost = Number(e.target.value); render(); });

      // Run AI Advisor
      const btnRunAi = document.getElementById('btnRunAiAdvisor');
      if (btnRunAi) {
        btnRunAi.addEventListener('click', () => {
          state.aiGenerating = true;
          render();
          setTimeout(() => {
            const analytics = getAggregatedAnalytics();
            state.aiInsightsData = {
              executiveSummary: `Based on the ${state.selectedYear} submission data, Jain College of Engineering, Belagavi achieves an institutional composite index of ${analytics.compositeScore}/100. Strongest performance is registered in Graduation Outcomes (GO: ${analytics.avgGO}) and Teaching-Learning (TLR: ${analytics.avgTLR}). The principal lever to elevate JCE Belagavi into the Top 100 NIRF Engineering Band lies in accelerating Scopus/WoS publications and sponsored research grants (RPC).`,
              coreStrengths: [
                `High Pass Percentage & Placement Conversion in CSE, AI&DS, and ISE branches (Avg GO: ${analytics.avgGO}).`,
                `Robust faculty retention and qualification metrics (FQE > 78%).`,
                `Full disability compliance and barrier-free campus infrastructure (PCS > 85%).`
              ],
              criticalVulnerabilities: [
                `Research & Professional Practice (RPC: ${analytics.avgRPC}) is below the Top-100 national benchmark of 55+.`,
                `Sponsored R&D grant revenue (FPPP) in Mechanical, Civil & EEE is suboptimal compared to computing branches.`,
                `Academic peer perception (PR: ${analytics.avgPR}) requires aggressive outreach outside North Karnataka.`
              ]
            };
            state.aiGenerating = false;
            logAudit('AI Diagnostic Run', `Synthesized strategic dossier for cycle ${state.selectedYear}`);
            showToast('AI Institutional Diagnostic synthesized.');
          }, 800);
        });
      }
    }

    // --- 7. APPLICATION BOOTSTRAP ---
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
